[project]
name = "dream-maker"
version = "0.1.0"
description = "Autonomous AI trading agent for Indian markets (Dhan, NSE F&O)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tenacity>=8.0",
    "requests>=2.31",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["agent*", "analysis*", "audit*", "llm*", "models*", "notifications*", "providers*", "risk*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
