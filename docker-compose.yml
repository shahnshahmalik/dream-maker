services:
  dream-maker:
    build: .
    container_name: dream-maker
    env_file:
      - .env
    environment:
      TZ: Asia/Kolkata
      STATE_DIR: /data/state
      TRADE_LOG_PATH: /data/trade_log.jsonl
    volumes:
      - dream-maker-data:/data
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # Do not also run scripts/ensure_running.sh on the same host — Docker handles restarts.
    # Single-instance lock: state/dream-maker.lock inside /data/state

volumes:
  dream-maker-data:
